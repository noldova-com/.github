# The headers every docs site sends with every answer, errors too. The policy limits what a page may embed or be embedded
# in, and leaves scripts and styles alone, since a prerendered page's hydration can need inline ones.

add_header Cache-Control $docs_cache always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
