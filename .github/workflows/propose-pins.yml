name: Propose pins

on:
  push:
    tags: ['v*.*.*']

permissions: {}

defaults:
  run:
    shell: bash

env:
  npm_config_ignore_scripts: 'true'
  PIPELINES_TOOL: '@noldova/tools.pipelines.github@0.0.17'

jobs:
  versions:
    name: Versions
    uses: ./.github/workflows/versions.yml
    permissions: {}
    with:
      targets: linux-x64

  pins:
    name: Propose the tag to the repositories that call these workflows
    needs: versions
    runs-on: ${{ fromJSON(needs.versions.outputs.runs-on-linux-x64) }}
    timeout-minutes: 30
    environment: version-updates
    concurrency:
      group: propose-pins
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Read the version from the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::$TAG is not a version tag, v<major>.<minor>.<patch>."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out the tagged commit with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.versions.outputs.node-version }}
          package-manager-cache: false

      - name: Install the pipelines tool
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/pipelines-tool.npmrc
        run: |
          npm install --prefix "$RUNNER_TEMP/pipelines-tool" --registry https://registry.npmjs.org/ --no-audit --no-fund "$PIPELINES_TOOL"
          echo "$RUNNER_TEMP/pipelines-tool/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Check that the App's key is set
        env:
          APP_KEY: ${{ secrets.VERSION_UPDATES_APP_KEY }}
        run: |
          if [ -z "$APP_KEY" ]; then
            echo "::error::VERSION_UPDATES_APP_KEY is empty: set it in the version-updates environment."
            exit 1
          fi

      - name: Create the App's token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.VERSION_UPDATES_CLIENT_ID }}
          private-key: ${{ secrets.VERSION_UPDATES_APP_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-issues: write
          permission-metadata: read
          permission-pull-requests: write
          permission-workflows: write

      - name: Read the App's bot account
        id: bot
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          id="$(gh api "users/$APP_SLUG%5Bbot%5D" --jq .id)"
          echo "name=$APP_SLUG[bot]" >> "$GITHUB_OUTPUT"
          echo "email=$id+$APP_SLUG[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Propose the tag
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.bot.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.bot.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.bot.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.bot.outputs.email }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: pipelines pins "$RELEASE_VERSION" "$RELEASE_COMMIT"
