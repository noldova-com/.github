name: Move image label

on:
  workflow_call:
    inputs:
      image:
        description: The image's name under the organization on ghcr.io, such as <repository>-docs
        required: true
        type: string
      digest:
        description: The digest the label moves to, sha256:<64 hex digits>, of an image already in that repository
        required: true
        type: string
      label:
        description: The label to move, such as latest; one that doesn't exist yet is made
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  move:
    name: Move the label
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: write
    env:
      CRANE_VERSION: v0.22.1
      CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
      IMAGE_NAME: ${{ inputs.image }}
      IMAGE_DIGEST: ${{ inputs.digest }}
      IMAGE_LABEL: ${{ inputs.label }}
    steps:
      - name: Check the inputs
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_NAME" =~ ^[a-z0-9]+([._/-]+[a-z0-9]+)*$ ]]; then
            echo "::error::The image must be a name under the organization in lower case, such as site-docs, not \"$IMAGE_NAME\". The label did not move."
            exit 1
          fi
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The digest must be sha256:<64 hex digits>, not \"$IMAGE_DIGEST\". The label did not move."
            exit 1
          fi
          if [[ ! "$IMAGE_LABEL" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::The label must be a valid image tag, such as latest, not \"$IMAGE_LABEL\". It did not move."
            exit 1
          fi

      - name: Download crane
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/crane"
          mkdir -p "$folder"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --output "$folder/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION/go-containerregistry_Linux_x86_64.tar.gz"
          echo "$CRANE_SHA256  $folder/crane.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$folder/crane.tar.gz" --directory "$folder" crane
          echo "$folder" >> "$GITHUB_PATH"
          "$folder/crane" version

      - name: Move the label
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/image-registry
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/$IMAGE_NAME"
          printf '%s' "$REGISTRY_TOKEN" | crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if ! crane digest "$image@$IMAGE_DIGEST" > /dev/null; then
            echo "::error::$image has no image with the digest $IMAGE_DIGEST, or the run's token can't read it. The label $IMAGE_LABEL did not move."
            exit 1
          fi
          if ! crane tag "$image@$IMAGE_DIGEST" "$IMAGE_LABEL"; then
            echo "::error::The registry refused to move the label $IMAGE_LABEL of $image to $IMAGE_DIGEST. The caller must grant packages: write, and the package must give this repository write access."
            exit 1
          fi
          {
            echo '### Image label'
            echo
            echo '| Image | Digest | Label |'
            echo '|---|---|---|'
            echo "| \`$image\` | \`$IMAGE_DIGEST\` | \`$IMAGE_LABEL\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Moved $image:$IMAGE_LABEL to $IMAGE_DIGEST."
