name: Flake proof

# The inputs' defaults, which the inputs below take by their anchors, since an input's default can't read env.
env:
  DEFAULT_RUNS: &default-runs '10'
  DEFAULT_PARALLEL_JOBS_PER_TARGET: &default-parallel-jobs-per-target '2'
  DEFAULT_TIMEOUT_MINUTES: &default-timeout-minutes '120'
  DEFAULT_TARGETS: &default-targets linux-x64 windows-x64
  DEFAULT_SCRIPT: &default-script test
  npm_config_ignore_scripts: 'true'

on:
  workflow_call:
    inputs:
      ref:
        description: The branch, tag or commit to test; empty tests the branch the run starts on
        type: string
        default: ''
      filter:
        description: The filters the script takes, separated by spaces; empty runs the whole suite
        type: string
        default: ''
      script:
        description: The npm script each run runs with the filters, such as an end-to-end test's
        type: string
        default: *default-script
      prepare:
        description: The npm scripts each job runs once after the build and before the runs, separated by spaces, such as an app's install and build
        type: string
        default: ''
      display:
        description: Runs each run on Linux under a virtual display and a session bus, and gives GitHub's Windows and macOS runners a 1920×1080 screen, for a test that opens windows
        type: boolean
        default: false
      reports:
        description: The folders in the checkout the script writes its report and results to, separated by spaces, such as _build/ui/report _build/ui/results; each run's go to the artifact
        type: string
        default: ''
      runs:
        description: Runs in total per target, 1 to 200
        type: string
        default: *default-runs
      jobs:
        description: Parallel jobs per target, 1 to 4
        type: string
        default: *default-parallel-jobs-per-target
      timeout-minutes:
        description: The minutes each test job may take, 1 to 360
        type: string
        default: *default-timeout-minutes
      targets:
        description: The targets to run on, separated by spaces, from linux-x64, linux-arm64, windows-x64, windows-arm64, macos-x64 and macos-arm64
        type: string
        default: *default-targets
      node-version:
        description: Overrides the Node version versions.yml names, such as 26.13.1
        type: string
        default: ''
      npm-version:
        description: Overrides the npm version versions.yml names, such as 11.20.0
        type: string
        default: ''
      install-registry-url:
        description: Overrides the registry versions.yml names for the scope's packages, such as https://npm.pkg.github.com
        type: string
        default: ''
      install-scope:
        description: Overrides the scope versions.yml names for that registry, such as @noldova-com
        type: string
        default: ''
      retention-days:
        description: Overrides the days versions.yml keeps the runs' logs and reports, 1 to 90
        type: string
        default: ''
      runs-on-linux-x64:
        description: Overrides the Linux x64 runner, as the JSON runs-on takes
        type: string
        default: ''
      runs-on-linux-arm64:
        description: Overrides the Linux arm64 runner, as the JSON runs-on takes
        type: string
        default: ''
      runs-on-windows-x64:
        description: Overrides the Windows x64 runner, as the JSON runs-on takes
        type: string
        default: ''
      runs-on-windows-arm64:
        description: Overrides the Windows arm64 runner, as the JSON runs-on takes
        type: string
        default: ''
      runs-on-macos-x64:
        description: Overrides the macOS x64 runner, as the JSON runs-on takes
        type: string
        default: ''
      runs-on-macos-arm64:
        description: Overrides the macOS arm64 runner, as the JSON runs-on takes
        type: string
        default: ''

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  versions:
    name: Versions
    uses: $/.github/workflows/versions.yml
    permissions: {}
    with:
      targets: ${{ inputs.targets }}
      node-version: ${{ inputs.node-version }}
      npm-version: ${{ inputs.npm-version }}
      install-registry-url: ${{ inputs.install-registry-url }}
      install-scope: ${{ inputs.install-scope }}
      retention-days: ${{ inputs.retention-days }}
      runs-on-linux-x64: ${{ inputs.runs-on-linux-x64 }}
      runs-on-linux-arm64: ${{ inputs.runs-on-linux-arm64 }}
      runs-on-windows-x64: ${{ inputs.runs-on-windows-x64 }}
      runs-on-windows-arm64: ${{ inputs.runs-on-windows-arm64 }}
      runs-on-macos-x64: ${{ inputs.runs-on-macos-x64 }}
      runs-on-macos-arm64: ${{ inputs.runs-on-macos-arm64 }}

  plan:
    name: Plan
    needs: versions
    runs-on: ${{ fromJSON(needs.versions.outputs.runs-on-linux-x64) }}
    timeout-minutes: 5
    permissions: {}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Plan the jobs
        id: plan
        env:
          RUNS: ${{ inputs.runs }}
          JOBS: ${{ inputs.jobs }}
          TIMEOUT: ${{ inputs.timeout-minutes }}
          TARGETS: ${{ inputs.targets }}
          REPORTS: ${{ inputs.reports }}
        run: |
          set -euo pipefail
          read -ra reports <<< "$REPORTS"
          for folder in ${reports[@]+"${reports[@]}"}; do
            if [[ ! "$folder" =~ ^[A-Za-z0-9_.][A-Za-z0-9._/-]*$ || "/$folder/" == */../* || "/$folder/" == */./* || "$folder" == *//* || "/$folder/" == /_build/flake-proof/* || /_build/flake-proof/ == "/${folder%/}/"* ]]; then
              echo "::error::Each of reports must be a folder inside the checkout that neither is nor holds _build/flake-proof, such as _build/ui/report, not \"$folder\"."
              exit 1
            fi
          done
          if ! [[ "$RUNS" =~ ^[0-9]+$ ]] || [ "$RUNS" -lt 1 ] || [ "$RUNS" -gt 200 ]; then
            echo "::error::runs must be a whole number from 1 to 200."
            exit 1
          fi
          if ! [[ "$JOBS" =~ ^[0-9]+$ ]] || [ "$JOBS" -lt 1 ] || [ "$JOBS" -gt 4 ]; then
            echo "::error::jobs must be a whole number from 1 to 4."
            exit 1
          fi
          if ! [[ "$TIMEOUT" =~ ^[0-9]+$ ]] || [ "$TIMEOUT" -lt 1 ] || [ "$TIMEOUT" -gt 360 ]; then
            echo "::error::timeout-minutes must be a whole number from 1 to 360."
            exit 1
          fi
          read -ra targets <<< "$TARGETS"
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::targets must name at least one target."
            exit 1
          fi
          jobs=$(( JOBS < RUNS ? JOBS : RUNS ))
          entries=()
          declare -A planned
          for target in "${targets[@]}"; do
            if [ -n "${planned[$target]:-}" ]; then
              continue
            fi
            planned[$target]=1
            for (( job = 0; job < jobs; job++ )); do
              entries+=("{\"target\":\"$target\",\"job\":$(( job + 1 )),\"runs\":$(( RUNS / jobs + (job < RUNS % jobs ? 1 : 0) ))}")
            done
          done
          matrix="[$(IFS=,; echo "${entries[*]}")]"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  test:
    name: ${{ matrix.target }} job ${{ matrix.job }}
    needs: [versions, plan]
    runs-on: ${{ fromJSON(needs.versions.outputs[format('runs-on-{0}', matrix.target)]) }}
    timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Note when the job started
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.versions.outputs.node-version }}
          package-manager-cache: false
          registry-url: ${{ needs.versions.outputs.install-registry-url }}
          scope: ${{ needs.versions.outputs.install-scope }}

      - name: Verify the toolchain
        env:
          NODE_VERSION: ${{ needs.versions.outputs.node-version }}
          NPM_VERSION: ${{ needs.versions.outputs.npm-version }}
        run: |
          node --version
          npm --version
          test "$(node --version)" = "v$NODE_VERSION"
          if [ -n "$NPM_VERSION" ]; then
            test "$(npm --version)" = "$NPM_VERSION"
          fi

      - name: Check the scripts
        env:
          SCRIPT: ${{ inputs.script }}
          PREPARE: ${{ inputs.prepare }}
        run: |
          node -e '
            const scripts = require("./package.json").scripts ?? {};
            const names = [process.env.SCRIPT, ...process.env.PREPARE.split(/\s+/).filter(t => t !== "")];
            const missing = names.filter(t => !Object.hasOwn(scripts, t));
            if (missing.length > 0) {
              console.log(`::error::The package has no npm script ${missing.map(t => JSON.stringify(t)).join(", ")}.`);
              process.exit(1);
            }'

      - name: Install the dependencies
        env:
          NODE_AUTH_TOKEN: ${{ needs.versions.outputs.install-registry-url == 'https://npm.pkg.github.com' && github.token || '' }}
        run: |
          npm ci --no-audit --no-fund
          for script in preinstall install postinstall prepare; do
            npm run "$script" --if-present
          done

      - name: Build the packages
        env:
          NODE_AUTH_TOKEN: ${{ needs.versions.outputs.install-registry-url == 'https://npm.pkg.github.com' && github.token || '' }}
        run: npm run build

      - name: Prepare the tests
        if: inputs.prepare != ''
        env:
          NODE_AUTH_TOKEN: ${{ needs.versions.outputs.install-registry-url == 'https://npm.pkg.github.com' && github.token || '' }}
          PREPARE: ${{ inputs.prepare }}
        run: |
          set -euo pipefail
          read -r -a prepare <<< "$PREPARE"
          for script in "${prepare[@]}"; do
            npm run "$script"
          done

      - name: Install the virtual display, the session bus and the keyring on GitHub's runner
        if: inputs.display && runner.os == 'Linux' && runner.environment == 'github-hosted'
        timeout-minutes: 10
        run: |
          apt=(sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=600 -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          packages=(xvfb xauth dbus-daemon dbus-bin gnome-keyring libglib2.0-bin)
          if ! "${apt[@]}" install -y --no-install-recommends "${packages[@]}"; then
            echo "Installing from the image's package lists failed, so they are updated first."
            "${apt[@]}" update
            "${apt[@]}" install -y --no-install-recommends "${packages[@]}"
          fi

      - name: Set the screen of GitHub's Windows runner to 1920×1080
        if: inputs.display && runner.os == 'Windows' && runner.environment == 'github-hosted'
        timeout-minutes: 2
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -TypeDefinition @'
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public static class ScreenMode
          {
              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              struct DisplayMode
              {
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string DeviceName;
                  public short SpecVersion, DriverVersion, Size, DriverExtra;
                  public int Fields, PositionX, PositionY, DisplayOrientation, DisplayFixedOutput;
                  public short Color, Duplex, YResolution, TTOption, Collate;
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string FormName;
                  public short LogPixels;
                  public int BitsPerPel, PelsWidth, PelsHeight, DisplayFlags, DisplayFrequency;
                  public int IcmMethod, IcmIntent, MediaType, DitherType, Reserved1, Reserved2, PanningWidth, PanningHeight;
              }
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              static extern bool EnumDisplaySettings(string device, int index, ref DisplayMode mode);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              static extern int ChangeDisplaySettings(ref DisplayMode mode, int flags);
              static DisplayMode Empty()
              {
                  var mode = new DisplayMode();
                  mode.Size = (short)Marshal.SizeOf(typeof(DisplayMode));
                  return mode;
              }
              public static int Set(int width, int height)
              {
                  var mode = Empty();
                  if (!EnumDisplaySettings(null, -1, ref mode)) return -100;
                  mode.PelsWidth = width;
                  mode.PelsHeight = height;
                  mode.Fields = 0x80000 | 0x100000;
                  return ChangeDisplaySettings(ref mode, 0);
              }
              public static string Modes()
              {
                  var sizes = new SortedSet<string>();
                  var mode = Empty();
                  for (var index = 0; EnumDisplaySettings(null, index, ref mode); index++) sizes.Add(mode.PelsWidth + "×" + mode.PelsHeight);
                  return string.Join(", ", sizes);
              }
          }
          '@
          $result = [ScreenMode]::Set(1920, 1080)
          if ($result -ne 0) {
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen
            Write-Output "::error::The runner's screen is $($screen.Bounds.Width)×$($screen.Bounds.Height) and couldn't be set to 1920×1080: ChangeDisplaySettings returned $result. Its display's modes are $([ScreenMode]::Modes())."
            exit 1
          }
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen
          if ($screen.Bounds.Width -ne 1920 -or $screen.Bounds.Height -ne 1080) {
            Write-Output "::error::The runner's screen is $($screen.Bounds.Width)×$($screen.Bounds.Height) after it was set to 1920×1080, so a test that opens windows can't size them."
            exit 1
          }
          Write-Output "The screen is $($screen.Bounds.Width)×$($screen.Bounds.Height), its work area $($screen.WorkingArea.Width)×$($screen.WorkingArea.Height)."

      - name: Set the screen of GitHub's macOS runner to 1920×1080
        if: inputs.display && runner.os == 'macOS' && runner.environment == 'github-hosted'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          read_size() {
            osascript -l JavaScript -e 'ObjC.import("AppKit"); const screen = $.NSScreen.mainScreen; screen.isNil() ? "0 0" : `${Math.round(screen.frame.size.width)} ${Math.round(screen.frame.size.height)}`'
          }
          read_checked_size() {
            size=$(read_size)
            read -r width height <<< "$size"
            if ! [[ "$width" =~ ^[0-9]+$ && "$height" =~ ^[0-9]+$ ]]; then
              echo "::error::The runner's screen size couldn't be read: NSScreen gave \"$size\"."
              exit 1
            fi
          }
          read_checked_size
          echo "The main screen is ${width}×${height} points."
          if [ "$width" -lt 1920 ] || [ "$height" -lt 1080 ]; then
            cat > "$RUNNER_TEMP/screen-mode.swift" <<'SWIFT'
          import CoreGraphics
          import Foundation

          let display = CGMainDisplayID()
          let options = [kCGDisplayShowDuplicateLowResolutionModes: kCFBooleanTrue] as CFDictionary
          let modes = (CGDisplayCopyAllDisplayModes(display, options) as? [CGDisplayMode]) ?? []
          print("The display's modes: \(modes.map { "\($0.width)×\($0.height)" }.joined(separator: ", "))")
          guard let mode = modes.first(where: { $0.width == 1920 && $0.height == 1080 }) else {
            print("::error::The runner's display has no 1920×1080 mode, so a test that opens windows can't size them.")
            exit(1)
          }
          var configuration: CGDisplayConfigRef?
          guard CGBeginDisplayConfiguration(&configuration) == .success,
            CGConfigureDisplayWithDisplayMode(configuration, display, mode, nil) == .success,
            CGCompleteDisplayConfiguration(configuration, .forSession) == .success else {
            print("::error::The runner's display couldn't be set to its 1920×1080 mode.")
            exit(1)
          }
          SWIFT
            swift "$RUNNER_TEMP/screen-mode.swift"
            read_checked_size
            echo "The main screen is now ${width}×${height} points."
          fi
          if [ "$width" -lt 1920 ] || [ "$height" -lt 1080 ]; then
            echo "::error::The runner's screen is ${width}×${height}, smaller than 1920×1080, so a test that opens windows can't size them."
            exit 1
          fi

      - name: Run the tests
        env:
          FILTER: ${{ inputs.filter }}
          SCRIPT: ${{ inputs.script }}
          VIRTUAL_DISPLAY: ${{ inputs.display }}
          REPORTS: ${{ inputs.reports }}
          RUNS: ${{ matrix.runs }}
          TARGET: ${{ matrix.target }}
          JOB: ${{ matrix.job }}
          JOB_MINUTES: ${{ inputs.timeout-minutes }}
        run: |
          set -uo pipefail
          read -r -a filters <<< "$FILTER"
          read -r -a reports <<< "$REPORTS"
          command=(npm run "$SCRIPT" -- ${filters[@]+"${filters[@]}"})
          keyring=false
          xvfb=
          # On Linux and macOS each run starts in a process group of its own and carries a marker in its environment, which every process it starts inherits,
          # so stopping it stops everything it started, also a browser or daemon that left the group. On Windows the run goes in a job object of its own:
          # its launcher ends the job's other processes and waits until none is left, and Windows ends them all if the launcher itself is killed.
          set -m
          active=
          if [ "$RUNNER_OS" = Windows ]; then
            launcher="$RUNNER_TEMP/flake-proof-launcher-$JOB.ps1"
            cat > "$launcher" <<'PS1'
          param([string] $Bash, [string] $Script, [string] $Left, [string] $Stop, [string] $Ended)
          $ErrorActionPreference = 'Stop'
          Add-Type -TypeDefinition @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          public static class FlakeProofJob {
            [StructLayout(LayoutKind.Sequential)] struct BasicLimits { public long PerProcessUserTimeLimit; public long PerJobUserTimeLimit; public uint LimitFlags; public UIntPtr MinimumWorkingSetSize; public UIntPtr MaximumWorkingSetSize; public uint ActiveProcessLimit; public UIntPtr Affinity; public uint PriorityClass; public uint SchedulingClass; }
            [StructLayout(LayoutKind.Sequential)] struct IoCounters { public ulong ReadOperationCount; public ulong WriteOperationCount; public ulong OtherOperationCount; public ulong ReadTransferCount; public ulong WriteTransferCount; public ulong OtherTransferCount; }
            [StructLayout(LayoutKind.Sequential)] struct ExtendedLimits { public BasicLimits Basic; public IoCounters Io; public UIntPtr ProcessMemoryLimit; public UIntPtr JobMemoryLimit; public UIntPtr PeakProcessMemoryUsed; public UIntPtr PeakJobMemoryUsed; }
            [DllImport("kernel32.dll", SetLastError = true)] static extern IntPtr CreateJobObject(IntPtr attributes, IntPtr name);
            [DllImport("kernel32.dll", SetLastError = true)] static extern bool SetInformationJobObject(IntPtr job, int infoClass, ref ExtendedLimits info, int length);
            [DllImport("kernel32.dll", SetLastError = true)] static extern bool AssignProcessToJobObject(IntPtr job, IntPtr process);
            [DllImport("kernel32.dll", SetLastError = true)] static extern bool QueryInformationJobObject(IntPtr job, int infoClass, IntPtr info, int length, IntPtr returned);
            [DllImport("kernel32.dll")] static extern IntPtr GetCurrentProcess();
            [DllImport("kernel32.dll", SetLastError = true)] static extern IntPtr OpenProcess(uint access, bool inherit, uint id);
            [DllImport("kernel32.dll", SetLastError = true)] static extern bool IsProcessInJob(IntPtr process, IntPtr job, out bool result);
            [DllImport("kernel32.dll", SetLastError = true)] static extern bool TerminateProcess(IntPtr process, uint exitCode);
            [DllImport("kernel32.dll", SetLastError = true)] static extern bool CloseHandle(IntPtr handle);
            public static IntPtr Join() {
              IntPtr job = CreateJobObject(IntPtr.Zero, IntPtr.Zero);
              if (job == IntPtr.Zero) throw new Win32Exception();
              ExtendedLimits limits = new ExtendedLimits();
              limits.Basic.LimitFlags = 0x2000;
              if (!SetInformationJobObject(job, 9, ref limits, Marshal.SizeOf(typeof(ExtendedLimits)))) throw new Win32Exception();
              if (!AssignProcessToJobObject(job, GetCurrentProcess())) throw new Win32Exception();
              return job;
            }
            public static long[] List(IntPtr job) {
              int size = 8 + 4096 * IntPtr.Size;
              IntPtr buffer = Marshal.AllocHGlobal(size);
              try {
                if (!QueryInformationJobObject(job, 3, buffer, size, IntPtr.Zero)) throw new Win32Exception();
                int count = Marshal.ReadInt32(buffer, 4);
                long[] ids = new long[count];
                for (int index = 0; index < count; index++) ids[index] = Marshal.ReadIntPtr(buffer, 8 + index * IntPtr.Size).ToInt64();
                return ids;
              }
              finally { Marshal.FreeHGlobal(buffer); }
            }
            public static int Active(IntPtr job) {
              IntPtr buffer = Marshal.AllocHGlobal(48);
              try {
                if (!QueryInformationJobObject(job, 1, buffer, 48, IntPtr.Zero)) throw new Win32Exception();
                return Marshal.ReadInt32(buffer, 40);
              }
              finally { Marshal.FreeHGlobal(buffer); }
            }
            public static void End(IntPtr job, long id) {
              IntPtr process = OpenProcess(0x1001, false, (uint) id);
              if (process == IntPtr.Zero) return;
              try {
                bool inJob;
                if (IsProcessInJob(process, job, out inJob) && inJob) TerminateProcess(process, 1);
              }
              finally { CloseHandle(process); }
            }
          }
          '@
          $job = [FlakeProofJob]::Join()
          $start = [System.Diagnostics.ProcessStartInfo]::new($Bash)
          $start.ArgumentList.Add($Script)
          $start.UseShellExecute = $false
          $run = [System.Diagnostics.Process]::Start($start)
          while (-not $run.WaitForExit(250)) { if (Test-Path -LiteralPath $Stop) { break } }
          $status = 1
          if ($run.HasExited) {
            $status = $run.ExitCode
            Set-Content -LiteralPath $Ended -Value $status
          }
          $found = [System.Collections.Generic.HashSet[long]]::new()
          $clock = [System.Diagnostics.Stopwatch]::StartNew()
          while ([FlakeProofJob]::Active($job) -gt 1 -and $clock.Elapsed.TotalSeconds -lt 25) {
            foreach ($id in [FlakeProofJob]::List($job) | Where-Object { $_ -ne $PID }) {
              $process = Get-Process -Id $id -ErrorAction SilentlyContinue
              if ($process -and $id -ne $run.Id -and $process.ProcessName -ne 'conhost') { [void] $found.Add($id) }
              [FlakeProofJob]::End($job, $id)
            }
            Start-Sleep -Milliseconds 250
          }
          if ([FlakeProofJob]::Active($job) -gt 1) { Set-Content -LiteralPath $Left -Value "stuck $($found.Count)" }
          else { Set-Content -LiteralPath $Left -Value $found.Count }
          exit $status
          PS1
            shell_path=$(cygpath -w "$(command -v bash)")
          fi
          marked() {
            if [ "$RUNNER_OS" = Linux ]; then
              { grep -lzxF "FLAKE_PROOF_RUN=$marker" /proc/[0-9]*/environ 2>/dev/null || true; } | sed 's#^/proc/##; s#/environ$##'
            else
              ps -A -E -ww -o pid= -o command= | awk -v marker="$marker" '{ for (field = 2; field <= NF; field++) if ($field == "FLAKE_PROOF_RUN=" marker) { print $1; next } }'
            fi
          }
          stop_run() {
            if [ "$RUNNER_OS" = Windows ]; then
              if [ "$1" = TERM ]; then
                : > "$stop_file"
              else
                kill -KILL "$pid" 2>/dev/null || true
              fi
            else
              kill "-$1" -- "-$pid" 2>/dev/null || true
              for other in $(marked 2>/dev/null); do
                kill "-$1" "$other" 2>/dev/null || true
              done
            fi
          }
          run_left() {
            kill -0 -- "-$pid" 2>/dev/null && return 0
            found=$(marked) || return 2
            [ -n "$found" ]
          }
          trap 'if [ -n "$active" ]; then stop_run KILL; fi; if [ -n "$xvfb" ]; then kill "$xvfb" 2>/dev/null || true; fi' EXIT
          if [ "$VIRTUAL_DISPLAY" = true ] && [ "$RUNNER_OS" = Linux ]; then
            command -v gnome-keyring-daemon >/dev/null || { echo "::error::gnome-keyring isn't installed on this runner; display mode needs it."; exit 1; }
            for program in Xvfb xauth dbus-run-session gdbus; do
              command -v "$program" >/dev/null || { echo "::error::This runner has no $program, which display mode runs each run under."; exit 1; }
            done
            keyring=true
            command=(dbus-run-session -- sh -c 'echo | XDG_DATA_HOME="$KEYRING/data" gnome-keyring-daemon --unlock --components=secrets --control-directory="$KEYRING/control" >/dev/null && { gdbus wait --session --timeout 30 org.freedesktop.secrets || { echo "The unlocked keyring did not take org.freedesktop.secrets on the session bus within 30 seconds."; touch "$KEYRING/no-secret-service"; exit 1; }; } && exec "$@"' sh "${command[@]}")
          fi
          # Each run may take an even share of the job's time still left, keeping three minutes for the artifact, so a run that hangs is named and counted as failed
          # before the job's timeout-minutes end the job unnamed. A watchdog in this shell bounds it, on every runner, since not every runner has GNU timeout.
          mkdir -p _build/flake-proof
          passed=0
          failed=0
          for run in $(seq 1 "$RUNS"); do
            log="_build/flake-proof/run-$run.log"
            if [ "$keyring" = true ]; then
              export KEYRING="$RUNNER_TEMP/flake-proof-keyring/$JOB-$run"
              mkdir -p "$KEYRING/data/keyrings"
              mkdir -m 700 "$KEYRING/control"
              printf login > "$KEYRING/data/keyrings/default"
              # Each run gets a new Xvfb on a display it picks itself with -displayfd, so jobs sharing a machine never race for one,
              # open only to a new cookie. Xvfb takes every cookie in its -auth file whatever display the entry names,
              # so the cookie goes in under :0 before the display is known, and under the display Xvfb picks once it is.
              export XAUTHORITY="$KEYRING/xauthority"
              touch "$XAUTHORITY"
              cookie=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
              xauth -q add :0 . "$cookie"
              mkfifo "$KEYRING/display"
              # Xvfb's own output, such as xkbcomp's warnings at each app's start, goes to a file beside the run's log, which the artifact keeps.
              Xvfb -displayfd 3 -auth "$XAUTHORITY" -screen 0 1920x1080x24 -nolisten tcp 3> "$KEYRING/display" 2> "_build/flake-proof/run-$run-xvfb.log" &
              xvfb=$!
              display=
              read -r -t 30 display < "$KEYRING/display" || true
              if [ -z "$display" ]; then
                echo "::error::Xvfb didn't start for run $run, so the run has no display. Its output:"
                cat "_build/flake-proof/run-$run-xvfb.log"
                exit 1
              fi
              xauth -q add ":$display" . "$cookie"
              export DISPLAY=":$display"
            fi
            limit=$(( (JOB_MINUTES * 60 - ($(date +%s) - JOB_STARTED) - 180) / (RUNS - run + 1) - 30 ))
            if [ "$limit" -lt 60 ]; then
              echo "::error::The job's timeout-minutes leave run $run $limit seconds; raise timeout-minutes or lower runs."
              exit 1
            fi
            reached="$RUNNER_TEMP/flake-proof-limit-$JOB-$run"
            status=0
            marker="$JOB.$run.$$.$(date +%s)"
            if [ "$RUNNER_OS" = Windows ]; then
              script="$RUNNER_TEMP/flake-proof-run-$JOB.sh"
              printf -v line '%q ' "${command[@]}"
              printf '%s\n' "$line" > "$script"
              left_file="$RUNNER_TEMP/flake-proof-left-$JOB-$run"
              stop_file="$RUNNER_TEMP/flake-proof-stop-$JOB-$run"
              ended="$RUNNER_TEMP/flake-proof-ended-$JOB-$run"
              rm -f "$left_file" "$stop_file" "$ended"
              FLAKE_PROOF_RUN="$marker" pwsh -NoProfile -NonInteractive -File "$launcher" -Bash "$shell_path" -Script "$(cygpath -w "$script")" -Left "$(cygpath -w "$left_file")" \
                -Stop "$(cygpath -w "$stop_file")" -Ended "$(cygpath -w "$ended")" > "$log" 2>&1 &
            else
              FLAKE_PROOF_RUN="$marker" "${command[@]}" > "$log" 2>&1 &
            fi
            pid=$!
            active=$pid
            # The watchdog stops the run at the limit, with TERM or, on Windows, the launcher's stop file, and kills it 30 seconds later; its own sleeps go when it is stopped,
            # so nothing outlives the run. On Windows the launcher's ended file says the run's own process ended by itself, so a limit reached during its cleanup stops nothing.
            (
              trap 'kill "$nap" 2>/dev/null; exit 0' TERM
              sleep "$limit" & nap=$!
              wait "$nap"
              [ -n "${ended:-}" ] && [ -e "$ended" ] && exit 0
              touch "$reached"
              stop_run TERM
              sleep 30 & nap=$!
              wait "$nap"
              stop_run KILL
            ) > /dev/null 2>&1 &
            watchdog=$!
            wait "$pid" || status=$?
            kill -TERM "$watchdog" 2>/dev/null || true
            wait "$watchdog" 2>/dev/null || true
            # A process the run left behind, such as a server, is stopped too, and the next run starts only once none is left.
            if [ "$run" -lt "$RUNS" ]; then
              after="before the next run"
            else
              after="before the job went on"
            fi
            if [ "$RUNNER_OS" = Windows ]; then
              count=$(tr -d '\r\n' < "$left_file" 2>/dev/null) || count=
              if [[ "$count" =~ ^stuck\ [0-9]+$ ]]; then
                echo "::error::Run $run left processes that didn't stop within 25 seconds, so they were still running $after."
                exit 1
              elif ! [[ "$count" =~ ^[0-9]+$ ]]; then
                echo "::error::Couldn't tell whether run $run left processes running: its launcher, which holds the run's job object, didn't report them; its log is kept in the job's artifact."
                exit 1
              elif [ "$count" -gt 0 ]; then
                echo "Run $run left processes running, which were stopped $after."
              fi
            else
              left=0
              run_left || left=$?
              if [ "$left" = 0 ]; then
                stop_run TERM
                for second in $(seq 1 30); do
                  run_left || break
                  sleep 1
                done
                if run_left; then
                  stop_run KILL
                  sleep 5
                fi
                left=0
                run_left || left=$?
                if [ "$left" = 0 ]; then
                  echo "::error::Run $run left processes that didn't stop within 35 seconds, so they were still running $after."
                  exit 1
                fi
                if [ "$left" = 1 ]; then
                  echo "Run $run left processes running, which were stopped $after."
                fi
              fi
              if [ "$left" = 2 ]; then
                echo "::error::Couldn't tell whether run $run left processes running: ps failed."
                exit 1
              fi
            fi
            active=
            if [ "$keyring" = true ] && [ -e "$KEYRING/no-secret-service" ]; then
              # The runner's keyring, not the test, failed: that is no flake, so the job ends here, as when Xvfb doesn't start.
              echo "::error::The unlocked keyring did not take org.freedesktop.secrets on the session bus within 30 seconds for run $run, so the run's test never started; its log is kept in the job's artifact."
              exit 1
            fi
            if [ "$status" = 0 ] && [ ! -e "$reached" ]; then
              passed=$(( passed + 1 ))
              echo "Run $run passed."
            elif [ -e "$reached" ]; then
              failed=$(( failed + 1 ))
              echo "::error::Run $run reached its limit of $limit seconds and was stopped; its log is kept in the job's artifact."
              tail -n 60 "$log"
            else
              failed=$(( failed + 1 ))
              echo "::error::Run $run failed; its log is kept in the job's artifact."
              tail -n 60 "$log"
            fi
            if [ -n "$xvfb" ]; then
              kill "$xvfb" 2>/dev/null || true
              wait "$xvfb" 2>/dev/null || true
              xvfb=
            fi
            for folder in ${reports[@]+"${reports[@]}"}; do
              if [ -e "$folder" ]; then
                if ! { mkdir -p "_build/flake-proof/run-$run/$(dirname "$folder")" && mv "$folder" "_build/flake-proof/run-$run/$folder"; }; then
                  echo "::warning::Run $run's $folder couldn't move into the artifact, so the artifact lacks it."
                fi
              fi
            done
          done
          {
            echo '| Target | Job | Runs | Passed | Failed |'
            echo '|---|---|---|---|---|'
            echo "| $TARGET | $JOB | $RUNS | $passed | $failed |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$passed of $RUNS runs passed."
          test "$failed" -eq 0

      - name: Keep the runs' logs and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-proof-${{ matrix.target }}-${{ matrix.job }}
          path: _build/flake-proof/
          retention-days: ${{ needs.versions.outputs.retention-days }}
          if-no-files-found: ignore
