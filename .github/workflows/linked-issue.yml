name: Require linked issue

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  issues: read
  pull-requests: read

jobs:
  linked-issue:
    uses: ./.github/workflows/require-linked-issue.yml
